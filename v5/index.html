<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F5FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A2A" media="(prefers-color-scheme: dark)">
<title>個人記録 v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* 版は BUILD の1か所だけ。?v= は loader が BUILD から作る */
window.BUILD = "UI v5.0 · 20261109-1945";
try { var __t = localStorage.getItem('prmock-theme'); if (__t) document.documentElement.dataset.theme = __t; } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav" aria-label="メイン"></nav>
<div class="scrim" id="scrim" aria-hidden="true"></div>
<div id="sheets"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* loader: 読み込む順を1か所に書く。BUILD から ?v= を作って差し込む(手で揃えない) */
(function () {
  var V = window.BUILD.split('·').pop().trim();
  var CSS = ['css/tokens.css', 'css/base.css', 'css/parts.css',
    'css/screens/home.css', 'css/screens/timeline.css', 'css/screens/detail.css', 'css/screens/plan.css',
    'css/screens/ledger.css', 'css/screens/create.css', 'css/screens/entities.css', 'css/screens/memo.css', 'css/screens/settings.css'];
  var JS = ['js/data.js', 'js/plans.js', 'js/money.js', 'js/core.js', 'js/parts.js',
    'js/screens/home.js', 'js/screens/timeline.js', 'js/screens/detail.js', 'js/screens/plan.js',
    'js/screens/ledger.js', 'js/screens/create.js', 'js/screens/entities.js', 'js/screens/memo.js', 'js/screens/settings.js'];
  var q = '?v=' + encodeURIComponent(V);
  CSS.forEach(function (f) { document.write('<link rel="stylesheet" href="' + f + q + '">'); });
  JS.forEach(function (f) { document.write('<script src="' + f + q + '"><\/script>'); });
})();
</script>
<script>boot();</script>
</body>
</html>
