<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>parts 見本(v5)</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/parts.css">
<style>
  /* 見本ページだけの枠(部品の見た目は parts.css) */
  html,body{margin:0;background:var(--bg);color:var(--tx);font:400 var(--fs-body)/1.5 var(--font)}
  body{min-height:100vh;padding-bottom:var(--sp-6)}
  .g-top{padding:var(--sp-4) var(--gutter) 0;font:600 var(--fs-cap)/1.3 var(--font);color:var(--tx-2)}
  .g-sec{margin-bottom:var(--sp-5)}
  .g-h{margin:var(--sp-5) var(--gutter) 0;font:700 var(--fs-title)/1.3 var(--font);color:var(--tx)}
  .g-box{padding:var(--sp-2) 0;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-2)}
  .g-box>*,.g-pair>*,.g-frame>*{min-width:0}
  .g-box>.p-ticket,.g-box>.p-pay{margin:0 var(--gutter);width:auto}
  .g-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--sp-6) * 2),1fr));gap:var(--sp-2);margin:0 var(--gutter);color:var(--tx-2)}
  .g-icons span{display:grid;justify-items:center;gap:var(--sp-1);font:500 var(--fs-min)/1.2 var(--font);color:var(--tx-3)}
  .g-icons .p-ic{color:var(--tx-2)}
  .g-navs{display:flex;gap:var(--sp-4);margin:var(--sp-4) var(--gutter) 0;color:var(--me)}
  .g-navs span{display:grid;justify-items:center;gap:var(--sp-1);font:500 var(--fs-min)/1.2 var(--font);color:var(--tx-2)}
  .g-pair{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-3);margin:0 var(--gutter)}
  .g-cap{font:500 var(--fs-min)/1.2 var(--font);color:var(--tx-3)}
  .g-frame{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-2);padding:var(--sp-2) 0}
</style>
</head>
<body>
<div class="g-top" id="g-top">parts 見本 (v5 DESIGN 2.2)</div>
<main id="g-main"></main>

<!-- 仮の小道具(core.js が無い時だけ使う。core.js が読まれていれば、そちらを使う) -->
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var th=q.get('theme');
  if(th==='light'||th==='dark')document.documentElement.dataset.theme=th;
  window.__ESC__={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  window.__shim={
    esc:function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return window.__ESC__[c]})},
    yen:function(n){return '¥'+Math.round(+n||0).toLocaleString('ja-JP')},
    fmtMD:function(d){return (+d.slice(5,7))+'月'+(+d.slice(8,10))+'日'},
    fmtMDW:function(d){var w='日月火水木金土'[new Date(d+'T00:00').getDay()];return (+d.slice(5,7))+'月'+(+d.slice(8,10))+'日('+w+')'},
    dowJ:function(d){return '日月火水木金土'[new Date(d+'T00:00').getDay()]},
    relDay:function(d){return d}
  };
  ['esc','yen','fmtMD','fmtMDW','dowJ','relDay'].forEach(function(k){
    if(typeof window[k]==='undefined')window[k]=window.__shim[k];
  });
  /* 品目の金額(本体は ui.js の lines 計算。core 側が無い時の仮。price のみ見る) */
  if(typeof window.itemAmt==='undefined')window.itemAmt=function(it){return (it&&it.price)||0};
  if(typeof window.lnSave==='undefined')window.lnSave=function(){return null};
})();
</script>
<script src="../js/data.js"></script>
<script src="../js/plans.js"></script>
<script src="../js/money.js"></script>
<script src="../js/parts.js"></script>
<script>
(function(){
  var main=document.getElementById('g-main');
  function H(s){return s}
  function sec(title,body){return '<section class="g-sec"><h2 class="g-h">'+title+'</h2>'+body+'</section>'}
  function frame(label,html){return '<div class="g-frame"><span class="g-cap">'+label+'</span>'+html+'</div>'}

  /* サンプルの id を data.js から拾う */
  var payId=Object.keys(A).find(function(k){return A[k].type==='支払い'&&A[k].x});
  var payPlain=Object.keys(A).find(function(k){return A[k].type==='支払い'&&!A[k].x});
  var momId=Object.keys(A).find(function(k){return A[k].type!=='支払い'&&A[k].type!=='支出'});
  var evId=Object.keys(EV)[0];
  var todoId=Object.keys(TD)[0];
  var xId=payId?A[payId].x:null;
  var unreg=null;
  var ent=Object.keys(E).filter(function(k){return k!=='me'});
  var hasE=ent.length?ent[0]:null;

  var out='';
  /* 1. 見出し */
  out+=sec('見出し・バー',
    '<div class="g-box">'+
    largeTitle('家計簿',{actions:[{label:'カテゴリ',icon:'cats',on:'void 0'},{label:'支払いを記録',primary:true,on:'void 0'}]})+
    largeTitle('自分の支出の長い題でも折り返さない題',{actions:[{label:'検索',icon:'search',iconOnly:true,on:'void 0'},{label:'追加',icon:'plus',iconOnly:true,on:'void 0'}]})+
    largeTitle('アクティビティ',{actions:[{label:'追加',icon:'plus',on:'void 0'}]})+
    appbar('10月30日(金)',{actions:[{label:'その他',icon:'more',on:'void 0'}]})+
    sh('関わったエンティティ',{count:2})+
    sh('品目',{count:5,act:{label:'追加',on:'void 0'}})+
    '</div>');

  /* 2. 面・行・属性 */
  out+=sec('面・行・属性',
    '<div class="g-box">'+
    list([row({t:'田中 花子',s:'同僚・割り勘メンバー',right:'¥1,000',href:'#/e/hanako'}),row({t:'自分の負担',s:'使った分',right:'¥2,240',on:'void 0'}),row({t:'読み取りのみ',s:'項目が空',chev:false}),row({t:'合計(rightHtml)',rightHtml:'<b>¥2,240</b> <small>税込</small>',chev:false})])+
    objRow({t:'ラーメン青葉',s:'10月30日 13:05',right:'¥4,580',href:'#/a/p1'})+
    list([prop('支払先','らーめん青葉'),prop('支払い方法','現金',{on:'void 0'}),prop('日付','10月30日(金)')])+
    '</div>');

  /* 3. 日・月 */
  out+=sec('日のカード・月の区切り',
    '<div class="g-box">'+
    dayCard('2026-10-31',{sum:'¥480',diary:'今日の一言'})+
    dayCard('2026-10-30',{sum:'¥2,240'})+
    dayCard('2026-10-29',{})+
    monthCard('2026-10')+
    '</div>');

  /* 4. 時間軸 */
  var axBody=
    axEdge('これより前の記録')+
    axRow({time:'12:00',end:'13:10',node:'ev',title:'花子さんとランチ',meta:'<span class="p-ax-m">らーめん青葉</span>',href:'#/a/p1'})+
    (payId?axRow({time:'13:05',node:'pay',body:payShell(payId,{mode:'row'})}):'')+
    nowLine()+
    axRow({time:'15:00',node:'plan',title:'歯医者(予定)',future:true,href:'#/ev/x'})+
    axRow({time:'11:00',node:'late',title:'記録にする?(遅れ)',href:'#/ev/x'})+
    axRow({time:'08:00',node:'moment',title:'起床',href:'#/a/x'})+
    axEdge('これから',true);
  out+=sec('時間軸・いまの線・軸の端',
    '<div class="g-box">'+axBody+
    capsule({kind:'done',kindLabel:'支払い',kindIcon:'pay',time:'13:05',title:'らーめん青葉',sub:'支払い ¥4,580'})+
    capsule({kind:'done',kindLabel:'会話',kindIcon:'talk',time:'12:00',end:'13:10',title:'花子さんとランチ',sub:'らーめん青葉'})+
    capsule({kind:'plan',kindLabel:'予定',kindIcon:'schedule',time:'15:00',title:'歯医者',sub:'予定'})+
    capsule({kind:'late',kindLabel:'予定',kindIcon:'schedule',time:'11:00',title:'記録にする?',sub:'過ぎた予定'})+
    capsule({kind:'moment',kindLabel:'',time:'08:00',title:'起床'})+
    capsule({kind:'moment',kindLabel:'体調',kindIcon:'spark',time:'07:30',title:'よく眠れた'})+
    '</div>');

  /* 5. 半券・支払い */
  var tk='';
  tk+=ticket({stub:'日常',title:'自分の支出',sub:'食費 › 外食',amt:'¥2,240',size:'md',href:'#/x/x1'});
  tk+=ticket({stub:'非日常',title:'自分の支出',sub:'旅行 › 宿',amt:'¥18,000',size:'md'});
  tk+=ticket({stub:'未設定',title:'自分の支出',sub:'未分類',amt:'¥480',size:'sm'});
  tk+=ticket({stub:'日常',title:'自分の支出',sub:'食費 › 外食',amt:'¥2,240',size:'lg',fill:true,label:'自分の支出'});
  tk+=ticket({stub:'日常',title:'自分の支出',sub:'食費 › 外食',amt:'¥2,240',size:'md',fill:true});
  var pay='';
  if(payId){
    pay+=frame('支払いの殻 row',payShell(payId,{mode:'row'}));
    pay+=frame('支払いの殻 kid(活動の中)',payShell(payId,{mode:'kid'}));
    pay+=frame('支払いの殻 pay(主役の下端)',capsule({kind:'done',time:'13:05',title:'らーめん青葉',sub:payShell(payId,{mode:'pay'})}));
    pay+=frame('支払いの殻 x(支出の詳細の最上部)',payShell(payId,{mode:'x'}));
    pay+=frame('お金の棒',payBar(payId));
  }
  pay+=frame('割合の棒',splitBar([{v:2240,kind:'me',label:'自分'},{v:2340,kind:'other',label:'花子さんの分'},{v:0,kind:'owe',label:'未精算'}]));
  out+=sec('半券・支払い・お金の棒',
    '<div class="g-box">'+tk+'</div><div class="g-pair">'+pay+'</div>');

  /* 6. 人・分類 */
  out+=sec('人・分類',
    '<div class="g-box">'+
    '<div class="g-pair">'+
    eref(hasE,'')+' '+eref(null,'未登録の店')+
    '</div>'+
    '<div class="g-pair">'+tag('食費')+' '+tag('貸し借り',{kind:'owe'})+' '+tag('遅れ',{kind:'late'})+' '+tag('カテゴリ',{color:'#55688C'})+'</div>'+
    '<div class="g-pair">'+catTag('food')+'</div>'+
    '</div>');

  /* 7. 操作 */
  var sample=[{k:'day',label:'日'},{k:'week',label:'週'},{k:'month',label:'月'}];
  out+=sec('操作・チェック・切替・入力',
    '<div class="g-box">'+
    chips([{k:'a',label:'カテゴリ'},{k:'b',label:'固定・変動'},{k:'c',label:'特別感'}],['a'],'void 0')+
    seg(sample,'month','void 0')+
    periodNav('10月 2026',{on:'void 0'},{on:'void 0'})+
    '<div class="g-pair">'+checkbox(false,{label:'完了'})+' '+checkbox(true,{label:'完了'})+' '+checkbox(false,{late:true,label:'遅れ'})+' '+toggle(true,{label:'通知'})+' '+toggle(false,{label:'通知'})+'</div>'+
    field('名前',input({value:'田中 花子',ph:'名前'}))+
    field('種類',select({options:[{v:'person',l:'人物'},{v:'place',l:'場所'}],value:'person'}))+
    '</div>');

  /* 8. 空・知らせ・印・進み */
  out+=sec('空・知らせ・印・進み・まとめ',
    '<div class="g-box">'+
    empty({shape:'list',text:'まだ記録がありません',action:{label:'記録を始める',on:'void 0'}})+
    empty({shape:'todo',text:'やることはありません'})+
    banner('warn','<b>借り</b> 花子さんに ¥1,000 を返す(未精算)')+
    banner('info','データは この端末に保存されます')+
    '<div class="g-pair">'+readMark({label:'読み取り'})+' '+readMark({label:'確かめる',on:'void 0'})+'</div>'+
    progress(0.6,{label:'予算の進み'})+
    summaryCard({metrics:[{v:'17件',l:'10月の記録',href:'#/activities'},{v:'¥145,214',l:'支出',href:'#/ledger'},{v:'3件',l:'ToDo',href:'#/todo'}],actions:[{label:'記録',icon:'plus',primary:true,on:'void 0'},{label:'予定',icon:'schedule',on:'void 0'}]})+
    '</div>');

  /* 9. 絵の一覧(線のアイコン・ナビの面) */
  var names=Object.keys(PARTS_IC);
  out+=sec('アイコン(線・ナビの面)',
    '<div class="g-icons">'+names.map(function(n){return '<span>'+icon(n)+n+'</span>'}).join('')+'</div>'+
    '<div class="g-navs">'+['home','memo','axis','todo','entity','ledger','settings'].map(function(n){return '<span>'+navIcon(n)+n+'</span>'}).join('')+'</div>');

  main.innerHTML=out;
  var t=document.getElementById('g-top');t.textContent='parts 見本 (v5 DESIGN 2.2) · テーマ: '+(document.documentElement.dataset.theme||'OS の設定');
})();
</script>
</body>
</html>
