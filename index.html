<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>個人記録 UIモック v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{
  --font:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --canvas:#F2F5FA; --surface:#FFFFFF; --border:#E2E7EF;
  --text:#1A2338; --text2:#566179; --muted:#8B94A7;
  --entity:#3D63B8; --entity-t:#EBF0FA;
  --activity:#2F8199; --activity-t:#E6F2F5;
  --note:#327F77; --note-t:#E6F2EF;
  --type:#34416B; --type-t:#E3E7F0;
  --expense:#34529E; --expense-t:#ECF0F9;
  --unknown:#D2602A; --unknown-t:#FDEEE6;
  --special:#6E55C8; --special-t:#EFEBFA;
  --schedule:#3A7CA5; --schedule-t:#E8F1F7; --g-schedule:linear-gradient(135deg,#7FC0DD 0%,#3A7CA5 100%);
  --todo:#C2456E; --todo-t:#FBEAF0; --g-todo:linear-gradient(135deg,#E37C9E 0%,#B83A64 100%);
  --g-entity:linear-gradient(135deg,#5E8BE6 0%,#3B5EBF 100%);
  --g-activity:linear-gradient(135deg,#46AFC6 0%,#2B7C98 100%);
  --g-note:linear-gradient(135deg,#4FAE9D 0%,#2D7A6F 100%);
  --g-expense:linear-gradient(135deg,#5B7BD8 0%,#344FA0 100%);
  --sh-card:0 4px 14px -4px rgba(26,38,72,.08),0 1px 2px rgba(26,38,72,.05);
  --sh-soft:0 22px 44px -18px rgba(40,72,150,.28),0 6px 16px -8px rgba(40,72,150,.10);
  --ds-soft:drop-shadow(0 16px 18px rgba(40,72,150,.18)) drop-shadow(0 3px 6px rgba(40,72,150,.08));
  --s1:4px; --s2:8px; --s3:10px; --s4:14px; --s5:16px; --s6:20px;
  --r-s:6px; --r-m:12px; --r-l:16px; --r-xl:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;background:#DCE3EE}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:1em;height:1em;flex:none;vertical-align:-.12em}

/* ===== Phone frame ===== */
.device{position:relative;width:100%;height:100dvh;margin:0 auto;overflow:hidden;background:var(--canvas)}
body{background:var(--canvas)}
@media (min-width:700px){
  body{display:flex;align-items:center;justify-content:center;padding:24px 0;background:#DCE3EE}
  .device{max-width:390px;height:min(844px,calc(100dvh - 48px));border-radius:40px;box-shadow:var(--sh-soft),0 0 0 10px #F7F9FC,0 0 0 11px #CDD5E2}
}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:36px var(--s5) 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.view{display:flex;flex-direction:column;gap:var(--s6);animation:fade .18s ease-out}
.view.push{animation:push .22s cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes push{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

.h1{font-size:22px;font-weight:700;letter-spacing:.01em}
.cap{font-size:11px;color:var(--muted)}
.sub{font-size:12px;color:var(--text2)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:var(--s2);min-width:0}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;flex-direction:column;gap:var(--s2)}
.topbar{display:flex;align-items:center;gap:var(--s2);height:32px;font-size:13px;font-weight:600}
.back{color:var(--c,var(--entity))}
.sec-h{display:flex;align-items:baseline;gap:var(--s2);padding:0 2px}
.sec-h b{font-size:12px;color:var(--text2)}
.sec-h .cnt{font-size:11px;color:var(--muted)}
.sec-h .act{margin-left:auto;font-size:12px;font-weight:600;color:var(--entity)}
/* 見た目を変えずに当たり判定だけ広げる(最小48前後) */
.hit{position:relative}
.hit::after{content:"";position:absolute;inset:-14px -12px}
.back,.sec-h .act,.topbar .cap,.mockchip,.ttog,.fact-ver{position:relative}
.back::after,.sec-h .act::after,.topbar .cap::after,.fact-ver::after{content:"";position:absolute;inset:-12px -14px}
.mockchip::after{content:"";position:absolute;inset:-10px -8px}
.ttog::after{content:"";position:absolute;inset:-6px}

/* 画面タイトル: クラスの形アイコン + 名前 */
.ptitle{display:flex;align-items:center;gap:10px}
.ptitle .mk{display:grid;place-items:center;width:34px;height:34px;color:#fff;font-size:18px;flex:none}

/* ===== 面の3段 ===== */
.flat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden}
.raised{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh-card);overflow:hidden}
.lrow{display:flex;align-items:center;gap:var(--s3);padding:12px var(--s4);min-height:50px;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:0}
a.lrow:active,button.lrow:active{background:#F6F8FB}
.ground-ref{display:flex;align-items:center;gap:var(--s2);min-height:46px;padding:var(--s2) var(--s3);border:1px dashed color-mix(in srgb,var(--c,var(--activity)) 50%,transparent);border-radius:var(--r-m);font-size:13px}

/* ===================================================================
   形の言語(クラスごとに輪郭そのものを変える)
   エンティティ = フォルダのタブ / アクティビティ = 時間軸のカプセル
   支払い = カプセル+レシートのギザギザ / 自分の支出 = 半券付きチケット
   ノート = 角を折った紙 / 種類 = 値札
   =================================================================== */
.obj{position:relative;filter:var(--ds-soft)}
.hero{position:relative;overflow:hidden;color:#fff;padding:var(--s5);display:flex;flex-direction:column;align-items:flex-start;gap:var(--s1)}
.hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:80%;height:180%;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.16) 48%,rgba(255,255,255,0) 62%)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(70% 60% at 0% 0%,rgba(255,255,255,.18),rgba(255,255,255,0) 70%)}
.hero>*{position:relative;z-index:1}
.hero .big{font-size:28px;font-weight:700;line-height:1.25}
.hero .title{font-size:20px;font-weight:700;line-height:1.3}
.hero .meta{font-size:11px;opacity:.9}
.lbl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em}

/* --- エンティティ: フォルダのタブ --- */
.obj-e .tab{position:relative;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 16px 0 14px;border-radius:14px 14px 0 0;background:#5986E4;color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em}
.obj-e .tab::after{content:"";position:absolute;right:-14px;bottom:0;width:14px;height:14px;background:radial-gradient(circle at 100% 0,transparent 13.5px,#5986E4 14px)}
.obj-e .hero{background:var(--g-entity);border-radius:0 var(--r-xl) var(--r-xl) var(--r-xl)}

/* --- アクティビティ: 時間軸に掛かったカプセル --- */
.obj-a{padding-left:22px}
.obj-a::before{content:"";position:absolute;left:7px;top:-14px;bottom:-14px;width:2px;border-radius:2px;background:linear-gradient(transparent,color-mix(in srgb,var(--activity) 45%,transparent) 20%,color-mix(in srgb,var(--activity) 45%,transparent) 80%,transparent)}
.obj-a::after{content:"";position:absolute;left:0;top:26px;width:16px;height:16px;border-radius:5px;background:#fff;border:4px solid var(--activity);box-sizing:border-box}
.obj-a .hero{background:var(--g-activity);border-radius:32px;padding:18px 20px}
.obj-a .lbl{height:24px;padding:0 10px 0 8px;border-radius:999px;background:rgba(255,255,255,.2)}
/* 日記: 日めくりカレンダーの1枚(綴じ穴の帯・大きな日付・罫線) */
.obj-d .hero{border-radius:18px;padding-top:36px;
  background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(255,255,255,.09) 27px 28px),var(--g-activity)}
.obj-d .bind{position:absolute;left:0;right:0;top:0;height:24px;z-index:2;display:flex;justify-content:space-around;align-items:center;padding:0 36px;background:rgba(8,40,56,.2)}
.obj-d .bind i{width:18px;height:8px;border-radius:4px;background:rgba(255,255,255,.75);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.obj-d .dnum{font-size:46px;font-weight:700;line-height:1;letter-spacing:-.02em}

/* --- 自分の支出: 半券付きチケット --- */
.obj-x .hero{--stub:66px;flex-direction:row;align-items:stretch;gap:0;padding:0;border-radius:14px;background:var(--g-expense);
  -webkit-mask:radial-gradient(circle 10px at var(--stub) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 10px at var(--stub) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle 10px at var(--stub) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 10px at var(--stub) 100%,#0000 97%,#000) bottom/100% 51% no-repeat}
.obj-x .stub{width:var(--stub);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:700;line-height:1.3;text-align:center;padding:14px 0}
.obj-x .stub svg{font-size:20px}
.obj-x .body{flex:1;padding:16px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;border-left:2px dashed rgba(255,255,255,.45)}

/* --- ノート: 角を折った紙 --- */
.obj-n .hero{background:var(--g-note);border-radius:var(--r-xl);
  -webkit-mask:linear-gradient(225deg,#0000 21px,#000 21.5px);mask:linear-gradient(225deg,#0000 21px,#000 21.5px)}
.obj-n .ear{position:absolute;top:0;right:0;width:30px;height:30px;border-radius:0 0 0 8px;z-index:2;
  background:linear-gradient(225deg,transparent 50%,#BFE3DB 50%);filter:drop-shadow(-2px 3px 3px rgba(20,60,55,.25))}
.obj-n .lbl{padding-top:2px}

/* ===== 小さい形(ラベル・チップ・参照) ===== */
/* アクティビティ: 丸いピル */
.b-act{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 9px 0 7px;border-radius:999px;background:var(--activity-t);color:var(--activity);font-size:10.5px;font-weight:600;white-space:nowrap}
/* 自分の支出: 両脇が欠けたチケット */
.b-exp{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 9px;border-radius:3px;background:var(--expense);color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap;
  -webkit-mask:radial-gradient(circle 4px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 4px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 4px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 4px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
/* ノート: 角を落とした紙片 */
.b-note{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 10px 0 7px;border-radius:3px;background:var(--note-t);color:var(--note);font-size:10.5px;font-weight:600;white-space:nowrap;
  -webkit-mask:linear-gradient(225deg,#0000 6px,#000 6.5px);mask:linear-gradient(225deg,#0000 6px,#000 6.5px)}
/* 種類: 値札 */
.type{position:relative;display:inline-flex;align-items:center;height:20px;padding:0 8px 0 15px;background:var(--type-t);color:var(--type);font-size:11px;font-weight:600;white-space:nowrap;border-radius:0 4px 4px 0;
  clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%)}
.type::before{content:"";position:absolute;left:7px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:currentColor;opacity:.6}
.type.ghost{background:rgba(255,255,255,.22);color:#fff}
.type.add{height:24px;background:none;color:#fff;clip-path:none;border:1px dashed rgba(255,255,255,.55);border-radius:4px;padding-left:8px}
.type.add::before{display:none}
/* エンティティ参照: 角の立った長方形 + 四角アバター */
.ref{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 3px;border-radius:7px;background:var(--entity-t);color:var(--entity);font-size:13px;font-weight:600;white-space:nowrap;max-width:100%;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--entity) 18%,transparent)}
.ref i{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--entity);color:#fff;font-style:normal;font-size:10px;font-weight:700;flex:none}
.ref.unreg{background:none;box-shadow:none;border:1px dashed var(--muted);color:var(--text2);padding-left:10px}
/* アクティビティ参照: ピル */
.aref{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px 0 7px;border-radius:999px;background:var(--activity-t);color:var(--activity);font-size:12px;font-weight:600}
.av{display:grid;place-items:center;flex:none;border-radius:9px;background:var(--entity-t);color:var(--entity);font-weight:700}
/* 一覧の先頭マーク */
.mk-a{width:10px;height:10px;border-radius:3px;border:3px solid var(--activity);background:#fff;flex:none}
.mk-x{color:var(--expense);font-size:18px;display:grid;flex:none}
.mk-n{color:var(--note);font-size:18px;display:grid;flex:none}

.seg{display:flex;padding:3px;background:#E7ECF4;border-radius:10px}
.seg a{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;height:38px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2)}
.seg a.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-card)}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;height:38px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-card)}
.pill{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--text2);white-space:nowrap}
.pill.on{background:var(--activity);border-color:var(--activity);color:#fff;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--s5)*-1);padding:0 var(--s5)}
.chips::-webkit-scrollbar{display:none}

/* ===== Timeline: 日=カプセル、出来事=軸上の丸 ===== */
.day{border-radius:26px}
.day-h{display:flex;align-items:center;gap:var(--s2);min-height:64px;padding:12px var(--s4) 10px 12px}
.day-h .dd{display:flex;flex-direction:column;width:40px;height:44px;border-radius:9px;overflow:hidden;background:#fff;flex:none;box-shadow:inset 0 0 0 1.5px var(--activity),0 2px 6px -2px rgba(47,129,153,.35)}
.day-h .dd span{height:14px;display:grid;place-items:center;background:var(--g-activity);color:#fff;font-size:9px;font-weight:700}
.day-h .dd b{flex:1;display:grid;place-items:center;color:var(--activity);font-size:17px;line-height:1}
.rail{position:relative;margin:0 0 6px 32px;border-left:2px solid color-mix(in srgb,var(--activity) 28%,transparent)}
.kid{position:relative;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4) 0 var(--s4);min-height:48px}
.kid::before{content:"";position:absolute;left:-6px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:3px;background:#fff;border:2.5px solid var(--activity);box-sizing:border-box}
.kid .t{width:36px;flex:none;font-size:11px;font-weight:600;color:var(--activity)}
.kid .ti{font-size:13px;font-weight:500}
.kid .amt{font-size:13px;font-weight:700}

.suggest{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s2) var(--s2) var(--s3);border-radius:var(--r-m);background:var(--entity-t);font-size:12px;color:var(--entity)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:38px;padding:0 14px;border-radius:9px;background:var(--entity);color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.disclose{font-size:12px;font-weight:600;color:var(--entity);min-height:46px;padding:var(--s3) var(--s4);text-align:left;width:100%}

/* ===== Bottom nav ===== */
.nav{position:absolute;left:var(--s5);right:var(--s5);bottom:calc(14px + env(safe-area-inset-bottom));height:66px;display:flex;align-items:center;justify-content:space-around;
  background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:var(--sh-soft);z-index:5}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;min-width:0;height:56px;border-radius:14px;white-space:nowrap;letter-spacing:-.02em;font-size:9.5px;font-weight:600;color:var(--muted)}
.nav a svg{font-size:19px}
.nav a.on{color:var(--c)}
.nav .plus{flex:none;width:58px;height:58px;margin:-30px 4px 0;border-radius:19px;border:4px solid var(--canvas);background:var(--g-entity);color:#fff;font-size:24px;display:grid;place-items:center;box-shadow:var(--sh-soft),inset 0 1px 0 rgba(255,255,255,.35)}

.scrim{position:absolute;inset:0;background:rgba(20,30,55,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:var(--s3) var(--s5) calc(var(--s6) + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.7,.2,1);z-index:9;box-shadow:0 -10px 40px -10px rgba(20,30,60,.25)}
.open .scrim{opacity:1;pointer-events:auto} .open .sheet{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:#D5DCE7;margin:0 auto var(--s4)}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,10px);opacity:0;transition:.2s;background:#1F2A44;color:#fff;font-size:12px;padding:8px 14px;border-radius:999px;z-index:10;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mockchip{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;font-size:10px;font-weight:600;color:var(--text2);background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:999px;padding:2px 8px}
.photo{width:52px;height:52px;border-radius:10px;flex:none;background:linear-gradient(160deg,#E3ECF8,#C9D8EE)}
.photo:nth-child(2){background:linear-gradient(160deg,#D7E6F7,#9FB8DF)}
.photo:nth-child(3){background:linear-gradient(160deg,#E9EEF5,#B9C6DB)}
.empty{padding:var(--s4);font-size:12px;color:var(--muted);text-align:center}
.tree{padding:6px 10px 6px 6px}
.trow{display:flex;align-items:center;gap:6px;min-height:46px;padding-right:4px}
.ttog{width:28px;height:28px;display:grid;place-items:center;color:var(--muted);font-size:10px;flex:none;border-radius:6px}
.ttog:active{background:#EEF1F6}
.tkids{margin-left:10px;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--type) 22%,transparent)}
/* 一覧: エンティティ=フォルダ型カード */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;filter:drop-shadow(0 4px 8px rgba(26,38,72,.09))}
.fcard{position:relative;display:block;padding-top:18px;min-width:0}
.ftab{position:absolute;top:0;left:0;height:19px;min-width:40px;padding:0 10px;border-radius:9px 9px 0 0;background:var(--entity);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.ftab::after{content:"";position:absolute;right:-9px;bottom:0;width:9px;height:9px;background:radial-gradient(circle at 100% 0,transparent 8.5px,var(--entity) 9px)}
.fbody{position:relative;background:#fff;border-radius:0 12px 12px 12px;border-top:3px solid var(--entity);padding:11px 12px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.fbody b{font-size:14px;padding-right:22px}
.fcount{position:absolute;right:10px;top:9px;display:flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--activity)}
.type.tiny{height:16px;font-size:10px;padding:0 6px 0 12px}
.type.tiny::before{left:5px}
/* 一覧: 自分の支出=切り離したチケット */

    if(n===1)return `<div class="lrow"><span class="grow ellipsis iname">${gr.n}${it.memo?`<span class="cap"> · ${it.memo}</span>`:''}</span>${unk(it)}<span class="cap burden">${it.b}</span>${tax?`<span class="cap tax">${it.tax}%</span>`:''}<span class="iamt num">${yen(gr.price)}</span><span class="chev"></span></div>`;
    const id='g'+(gid++);
    return `<button class="lrow grp" onclick="togGrp('${id}',this)"><span class="grow ellipsis iname">${gr.n}<span class="cntx">×${n}</span><span class="cap"> @${yen(gr.price)}</span></span>${tax?`<span class="cap tax">${it.tax}%</span>`:''}<span class="iamt num">${yen(gr.price*n)}</span><span class="cap chev">▸</span></button>

  <div class="obj obj-p"><div class="hero"><div class="row" style="gap:6px"><span class="lbl">${IC.schedule}予定</span>${e.rep?`<span class="type ghost">${e.rep}</span>`:''}</div>
    <span class="title">${e.t}</span><span class="big num" style="font-size:24px">${e.all?'終日':`${e.s} – ${e.e}`}</span><span class="meta">${mdw(e.d)}${e.d2?' – '+mdw(e.d2):''}${e.rep?' · 次回 '+mdw(nextOn(e)):''}</span></div></div>
  ${e.pay?`<div class="stack">${sec('支払いの予定')}<div class="flat"><div class="lrow"><span class="cap" style="width:56px">金額</span><b class="grow num">${yen(e.pay.amt)}</b></div><div class="lrow"><span class="cap" style="width:56px">カテゴリ</span><span class="grow">${catChip(e.pay.cat,1)}</span><span class="cap" style="font-weight:700;color:#5E6E91">${catFx(e.pay.cat)}費</span></div></div><a class="cap hit" href="#/ledger" style="padding:0 2px;font-weight:600;color:var(--expense)">家計簿 › これからの固定費</a></div>`:''}
  <div class="stack">${sec('詳細')}<div class="flat">
    ${e.place?`<div class="lrow"><span class="cap" style="width:56px">場所</span>${e.place[0]?ref(e.place[0]):`<span class="ref unreg">${e.place[1]}</span>`}</div>`:''}
    ${e.who?`<div class="lrow"><span class="cap" style="width:56px">参加者</span><span class="row" style="flex-wrap:wrap;gap:6px">${e.who.map(ref).join('')}</span></div>`:''}
    <div class="lrow"><span class="cap" style="width:56px">繰り返し</span><span class="grow">${e.rep||'なし'}</span></div>
    <div class="lrow"><span class="cap" style="width:56px">通知</span><span class="grow">${e.alarm||'なし'}</span></div>
    ${e.memo?`<div class="lrow"><span class="cap" style="width:56px">メモ</span><span class="grow">${e.memo}</span></div>`:''}</div>
    ${e.place&&!e.place[0]?`<div class="suggest"><span class="grow ellipsis">「${e.place[1]}」は未登録</span><button class="btn" onclick="toast('エンティティに登録(モック)')">＋ 場所として登録</button></div>`:''}</div>
  ${e.todo?`<div class="stack">${sec('この予定のToDo',e.todo.length,'＋ 追加')}<div class="flat">${e.todo.map(trow).join('')}</div></div>`:''}
  <div class="stack">${sec('記録')}
    ${e.rec?`<a class="arow" href="#/a/${e.rec}"><span class="mk-a"></span>${bAct(A[e.rec].type)}<span class="grow ellipsis" style="font-size:13px">${A[e.rec].title} · ${md(A[A[e.rec].parent].date)}</span><span class="rec">✓ 記録済み</span></a>`
      :`<button class="btn" style="height:46px;background:var(--activity)" onclick="toast('この予定からアクティビティを作成(モック)')">${past||e.d===TODAY?'記録にする(アクティビティを作成)':'終わったら記録にできます'}</button>`}</div>
  </div>`}
/* ======================= ToDo ======================= */
let todoView='today',showDone=false;
function trow(k){const t=TD[k];const over=t.due&&t.due<TODAY&&!t.done;
  const due=t.due?`<span class="due ${over?'over':t.due===TODAY?'today':''}">${over?'期限切れ ':''}${t.due===TODAY?'今日':md(t.due)}</span>`:'';
  const meta=[due,t.rep?`<span>↻ ${t.rep}</span>`:'',todoView.startsWith('list:')?'':`<span>${LISTS[t.list].n}</span>`,
    t.ent?t.ent.map(e=>`<span class="mini">▣ ${E[e].n}</span>`).join(''):'',t.ev?`<span class="mini ev">${IC.schedule}${EV[t.ev].t}</span>`:'',
    t.sub?`<span>☑ ${t.sub.filter(x=>x[1]).length}/${t.sub.length}</span>`:'',t.pay?`<span class="mini" style="color:var(--expense)">${IC.expense}${md(A[A[t.pay].parent].date)}に購入</span>`:''].filter(Boolean).join('');
  return `<div class="task ${t.done?'done':''}"><button class="chk" onclick="togTask('${k}')">${t.done?'✓':''}</button><a class="tbody" href="#/t/${k}"><span class="tt">${t.t}</span>${meta?`<span class="tmeta">${meta}</span>`:''}</a>${t.pri?'<span class="pri">!</span>':''}</div>`}
function vTodo(){
  const ks=Object.keys(TD);const open=ks.filter(tdOpen);
  const nToday=open.filter(k=>TD[k].due===TODAY).length,nOver=open.filter(k=>TD[k].due&&TD[k].due<TODAY).length,nDone=ks.filter(k=>TD[k].done).length;
  const views=[['today','今日',open.filter(k=>TD[k].due&&TD[k].due<=TODAY).length],['upcoming','予定あり',open.filter(k=>TD[k].due>TODAY).length],['all','すべて',open.length],...Object.entries(LISTS).map(([l,L])=>['list:'+l,L.n,open.filter(k=>TD[k].list===l).length])];
  let pick;if(todoView==='today')pick=k=>TD[k].due&&TD[k].due<=TODAY||TD[k].done===TODAY;else if(todoView==='upcoming')pick=k=>TD[k].due>TODAY;else if(todoView==='all')pick=()=>true;else pick=k=>TD[k].list===todoView.slice(5);
  const sel=ks.filter(pick);
  const secs=[['期限切れ',k=>TD[k].due&&TD[k].due<TODAY,'over'],['今日',k=>TD[k].due===TODAY],['これから',k=>TD[k].due>TODAY],['期限なし',k=>!TD[k].due]];
  const openSel=sel.filter(tdOpen),doneSel=sel.filter(k=>!tdOpen(k));
  const shopSug=todoView==='list:shop'||todoView==='all'?open.filter(k=>TD[k].list==='shop'&&k==='t4'):[];
  return `<div class="view">
  <div class="ptitle">${MK.todo}<a class="h1 off" href="#/schedule">予定</a><span class="h1">ToDo</span></div>
  ${intro('todo',mrow(ND.todo('ToDo')+arr('結び付く')+box(ND.ent('人・場所')+ND.plan('予定')))+mrow(ND.todo('買い物')+arr('買ったら')+ND.act('支払い')+arr()+'<span class="chk on" style="width:20px;height:20px;font-size:11px;border-radius:6px">✓</span>'),[['今日',nToday+'件','#/todo'],['期限切れ',nOver+'件'],['完了',nDone+'件']])}
  <div class="chips">${views.map(([k,l,n])=>`<button class="pill todo ${todoView===k?'on':''}" onclick="setTodo('${k}')">${l} <span style="opacity:.7">${n}</span></button>`).join('')}</div>
  <div class="qadd"><span class="chk" style="border-style:dashed"></span><input id="qa" placeholder="ToDoを追加(例: 明日 牛乳 #買い物)" onkeydown="if(event.key==='Enter')addTask()"><button class="btn" style="background:var(--todo)" onclick="addTask()">追加</button></div>
  ${shopSug.length?`<div class="suggest todo"><span class="grow ellipsis">10/29 スーパー青葉台の支払いに「牛乳」</span><button class="btn" onclick="doneBy('t4','p2')">完了にする</button></div>`:''}
  ${secs.map(([l,f,c])=>{const xs=openSel.filter(f);return xs.length?`<div class="stack"><div class="tsec ${c||''}">${l} <span class="cap">${xs.length}</span></div><div class="raised">${xs.map(trow).join('')}</div></div>`:''}).join('')||(openSel.length?'':'<div class="flat empty">すべて完了</div>')}
  ${doneSel.length?`<div class="stack"><button class="ghead" onclick="showDone=!showDone;render()"><span class="tsec">完了 <span class="cap">${doneSel.length}</span></span><span class="grow"></span><span class="cap">${showDone?'▾':'▸'}</span></button>${showDone?`<div class="flat">${doneSel.map(trow).join('')}</div>`:''}</div>`:''}
  </div>`}
function setTodo(v){todoView=v;render()}
function togTask(k){const t=TD[k];t.done=t.done?undefined:TODAY;const y=$('#scroll').scrollTop;render();$('#scroll').scrollTop=y;if(t.done)toast('「'+t.t+'」を完了')}
function doneBy(k,pay){TD[k].done='2026-10-29';TD[k].pay=pay;render();toast('支払いの品目から完了にしました')}
function addTask(){const el=$('#qa');let v=el.value.trim();if(!v)return;let due,list=todoView.startsWith('list:')?todoView.slice(5):'inbox';
  if(v.includes('今日')){due=TODAY;v=v.replace('今日','').trim()}if(v.includes('明日')){due=addDays(TODAY,1);v=v.replace('明日','').trim()}
  const m=v.match(/#(\S+)/);if(m){const l=Object.entries(LISTS).find(([k,L])=>L.n===m[1]);if(l)list=l[0];v=v.replace(m[0],'').trim()}
  TD['n'+Date.now()]={t:v,due,list};render();toast('追加: '+v+(due?' · '+md(due):'')+' · '+LISTS[list].n)}
function vTask(k){const t=TD[k];
  return `<div class="view push">
  ${topbar('ToDo','todo')}
  <div class="obj obj-t"><div class="hero"><div class="hc"><button class="chk ${t.done?'on':''}" onclick="togTask('${k}')">${t.done?'✓':''}</button></div>
    <div class="hb"><span class="lbl">${IC.todo}ToDo · ${LISTS[t.list].n}</span><span class="title" style="${t.done?'text-decoration:line-through;opacity:.8':''}">${t.t}</span><span class="meta">${t.done?'完了 '+md(t.done):t.due?'期限 '+mdw(t.due):'期限なし'}${t.pri?' · 優先':''}</span></div></div></div>
  <div class="stack">${sec('詳細')}<div class="flat">
    <button class="lrow" style="width:100%;text-align:left" onclick="toast('期限を選ぶ(モック)')"><span class="cap" style="width:56px">期限</span><span class="grow">${t.due?mdw(t.due):'なし'}</span><span class="cap">›</span></button>
    <button class="lrow" style="width:100%;text-align:left" onclick="toast('繰り返し(モック)')"><span class="cap" style="width:56px">繰り返し</span><span class="grow">${t.rep||'なし'}</span><span class="cap">›</span></button>
    <div class="lrow"><span class="cap" style="width:56px">優先度</span><span class="grow"><span class="segm"><button class="${t.pri?'':'on'}">通常</button><button class="${t.pri?'on':''}" style="${t.pri?'color:#C4553F':''}">! 優先</button></span></span></div>
    <div class="lrow"><span class="cap" style="width:56px">リスト</span><span class="grow">${LISTS[t.list].n}</span>${LISTS[t.list].shop?`<span class="cap">買う店 ${E[LISTS[t.list].shop].n}</span>`:''}</div></div></div>
  <div class="stack">${sec('結び付き','','＋ 追加')}<div class="flat">
    ${t.ent?t.ent.map(e=>`<div class="lrow"><span class="cap" style="width:56px">対象</span>${ref(e)}</div>`).join(''):''}
    ${t.ev?`<a class="lrow" href="#/ev/${t.ev}"><span class="cap" style="width:56px">予定</span><span class="b-plan">予定</span><span class="grow ellipsis">${EV[t.ev].t}</span><span class="cap">${md(EV[t.ev].d)} ›</span></a>`:''}
    ${t.pay?`<a class="lrow" href="#/a/${t.pay}"><span class="cap" style="width:56px">購入</span>${bAct('支払い')}<span class="grow ellipsis">${A[t.pay].title} · ${shopOf(X[A[t.pay].x])}</span><span class="cap">›</span></a>`:''}
    ${!t.ent&&!t.ev&&!t.pay?'<div class="empty">人・場所・予定・支払いに結び付けられます</div>':''}</div></div>
  ${t.sub?`<div class="stack">${sec('サブタスク',t.sub.filter(x=>x[1]).length+'/'+t.sub.length,'＋ 追加')}<div class="flat">${t.sub.map((x,i)=>`<div class="task ${x[1]?'done':''}"><button class="chk" onclick="TD['${k}'].sub[${i}][1]=TD['${k}'].sub[${i}][1]?0:1;render()">${x[1]?'✓':''}</button><span class="tbody"><span class="tt">${x[0]}</span></span></div>`).join('')}</div></div>`:''}
  ${t.memo?`<div class="stack">${sec('メモ')}<div class="flat" style="padding:var(--s4);font-size:14px">${t.memo}</div></div>`:''}
  </div>`}

/* ======================= router ======================= */
const TABS=[['activities','アクティビティ','activity','activity'],['schedule','予定・ToDo','schedule','schedule','plan'],null,['entities','エンティティ','entity','entity'],['ledger','家計簿','expense','expense']];
function render(){
  const h=location.hash.slice(2)||'activities';const [r,id]=h.split('/');
  let html,tab;
  switch(r){
    case 'ledger':html=vLedger();tab='ledger';break;
    case 'cats':html=vCats();tab='ledger';break;
    case 'entities':html=vEntities(id);tab='entities';break;
    case 'types':html=vTypes();tab='entities';break;
    case 'notes':html=vNotes();tab='entities';break;
    case 'schedule':html=vSchedule();tab='plan';lastPlan='schedule';break;
    case 'ev':html=vEvent(id);tab='plan';break;
    case 'todo':html=vTodo();tab='plan';lastPlan='todo';break;
    case 't':html=vTask(id);tab='plan';break;
    case 'e':html=vEntity(id);tab='entities';break;
    case 'a':html=vActivity(id);tab='activities';break;
    case 'x':html=vExpense(id);tab='ledger';break;
    case 'n':html=vNote(id);tab='entities';break;
    default:html=vActivities();tab='activities';
  }
  $('#app').innerHTML=html;$('#scroll').scrollTop=0;
  $('#nav').innerHTML=TABS.map(t=>!t?`<button class="plus" onclick="openCreate()">＋</button>`:`<a href="#/${t[4]?lastPlan:t[0]}" class="${(t[4]||t[0])===tab?'on':''}" style="--c:var(--${t[3]})">${IC[t[2]]}${t[1]}</a>`).join('');
  curTab=(r==='todo'||r==='t')?'todo':tab;
}
function goBack(){history.length>1?history.back():location.hash='#/activities'}
window.addEventListener('hashchange',render);
function tog(id,btn,label){const el=document.getElementById(id);el.hidden=!el.hidden;if(btn)btn.textContent=el.hidden?label+' ▾':'閉じる ▴'}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)}
function sheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#dev').classList.add('open')}
function closeSheet(){$('#dev').classList.remove('open')}
let curTab='activities',lastPlan='schedule';
function openCreate(){const first={schedule:`<button class="lrow" style="width:100%" onclick="closeSheet();toast('予定の作成(モック)')">${MK.schedule}<span class="grow" style="text-align:left"><b>予定</b><div class="cap">日時・場所・参加者</div></span></button>`,
  todo:`<button class="lrow" style="width:100%" onclick="closeSheet();$('#qa')&&$('#qa').focus()">${MK.todo}<span class="grow" style="text-align:left"><b>ToDo</b><div class="cap">期限・リスト・結び付く人や予定</div></span></button>`};
  const order=curTab==='todo'?['todo','schedule']:['schedule','todo'];
  sheet(`<div class="h1" style="font-size:17px;margin-bottom:var(--s3)">新しく作る</div>
  <div class="flat">${order.map(k=>first[k]).join('')}
   <button class="lrow" style="width:100%" onclick="closeSheet();toast('支払いの入力(モック)')">${MK.activity}<span class="grow" style="text-align:left"><b>支払い</b><div class="cap">レシートを撮る・金額を入れる</div></span></button>
   <button class="lrow" style="width:100%" onclick="closeSheet();toast('出来事の入力(モック)')">${MK.activity}<span class="grow" style="text-align:left"><b>出来事・日記</b><div class="cap">今日の日記の子として追加</div></span></button>
   <button class="lrow" style="width:100%" onclick="closeSheet();toast('エンティティの作成(モック)')">${MK.entity}<span class="grow" style="text-align:left"><b>エンティティ</b><div class="cap">人・場所・物。ノートはここから</div></span></button>
  </div>`)}
function openAbout(){sheet(`<div class="h1" style="font-size:17px">UIモック v2 について</div>
  <div class="sub" style="margin:6px 0 var(--s4)">UIと遷移の確認だけのための簡易モック。データは架空、保存はしません。</div>
  <div class="flat" style="padding:var(--s4)"><div class="legend">
    ${MK.entity}<span><b>エンティティ</b> = フォルダのタブ(事実を綴じる)</span>
    ${MK.activity}<span><b>アクティビティ</b> = 時間軸に掛かったカプセル(印は丸角正方形)。<b>日記</b>は日めくりカレンダーの1枚</span>
    <span class="mk" style="width:34px;height:34px;display:grid;place-items:center;color:var(--expense);font-size:28px">${IC.expense}</span><span><b>自分の支出</b> = 半券付きのチケット</span>
    ${MK.note}<span><b>ノート</b> = 角を折った紙</span>
    ${MK.schedule}<span><b>予定</b> = 点線の輪郭(まだ起きていないアクティビティ)。終わると記録に結び付く</span>
    ${MK.todo}<span><b>ToDo</b> = チェック欄の付いたカード</span>
    ${MK.type}<span><b>種類</b> = 値札(タグ)。エンティティ画面の「種類の管理」から</span>
    <span class="cat" style="justify-self:start">外食</span><span><b>カテゴリ</b>(家計簿) = 帳簿のインデックス。<span class="spc">✦ 非日常</span> は特別感</span>
  </div></div>
  <div class="flat" style="padding:var(--s3) var(--s4);font-size:12px;line-height:1.8;color:var(--text2);margin-top:var(--s3)">
   ・土台: エンティティ/ノート/アクティビティの構想(2026-10-25・<b>未合意</b>)<br>
   ・支払い ⇒ 自分の支出の親子(2026-10-28 決定)<br>
   ・試せる操作: 各行タップで遷移 / 事実の「版 ⟲」/ 「詳細」の開閉 / 品目「×2」の行で中身を開く(10/30の生ビール・10/29の卵)/ 「負担を表示」/ 10/28の支払いで未登録店の「＋ 店として登録」/ 家計簿タブ: 内訳の軸切替(カテゴリ・特別感・店・同席)と行タップで絞り込み / 自分の支出で特別感を切替 / 「種類の管理」「カテゴリの管理」の ••• で編集、＋ で作成
  </div>`)}
function registerShop(aid){const a=A[aid];const r=a.roles.find(r=>!r[1]);const id='bakery';
  E[id]={n:r[2],i:r[2][0],t:['bakery'],facts:[]};r[1]=id;render();toast('「'+r[2]+'」をエンティティに登録しました')}
render();
</script>
</body>
</html>
