<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color">
<meta name="mobile-web-app-capable" content="yes">
<title>個人記録 v7</title>
<script>
/* 版は BUILD の1か所だけ */
window.BUILD = "v7.1.1 · 20261116-2000";
try { var __t = localStorage.getItem('prmock-v6-theme') || 'auto'; document.documentElement.dataset.theme = (__t === 'dark' || (__t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) ? 'dark' : 'light'; } catch (e) {}
</script>
</head>
<body>
<div id="shell"><nav id="rail" aria-label="メイン"></nav><main id="main"></main><aside id="side"></aside></div>
<nav id="nav" aria-label="メイン"></nav>
<div id="sheets"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
(function () {
  var V = '?v=' + encodeURIComponent(window.BUILD.split('·').pop().trim() + (window.__BUST || ''));
  var CSS = ['fonts/mplus2.css', 'css/tokens.css', 'css/base.css', 'css/parts.css', 'css/screens.css', 'css/s-detail.css', 'css/s-pay.css', 'css/s-ledger.css', 'css/s-ents.css', 'css/s-todo.css', 'css/s-memo.css', 'css/s-misc.css', 'css/s-inbox.css', 'css/s-inbox-log.css', 'css/s-inbox-conv.css', 'css/voice.css'];
  var JS = ['js/model.js', 'js/m-inbox.js', 'js/m-llm.js', 'js/core.js', 'js/parts.js', 'js/s-home.js', 'js/s-timeline.js', 'js/s-detail.js', 'js/s-pay.js', 'js/s-ledger.js', 'js/s-ents.js', 'js/s-todo.js', 'js/s-memo.js', 'js/s-misc.js', 'js/s-inbox.js', 'js/s-inbox-conv.js', 'js/voice.js', 'js/kbd.js'];
  CSS.forEach(function (f) { document.write('<link rel="stylesheet" href="' + f + V + '">'); });
  JS.forEach(function (f) { document.write('<script src="' + f + V + '"><\/script>'); });
})();
</script>
<script>
/* boot が無い・例外で止まった時も、白い画面を残さない(読み込み失敗の面を出す) */
try { boot(); window.llmRecover && llmRecover(); window.voiceInit && voiceInit(); }
catch (e) {
  console.error(e); document.documentElement.classList.add('ready');
  var mm = document.getElementById('main');
  if (mm) mm.innerHTML = '<div class="screen" role="alert"><div class="empty"><p>読み込みに失敗しました</p></div></div>';
}
</script>
</body>
</html>
