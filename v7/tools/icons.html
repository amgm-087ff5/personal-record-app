<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<title>アイコン一覧(確認用)</title>
<link rel="stylesheet" href="../fonts/noto.css">
<link rel="stylesheet" href="../css/tokens.css">
<style>
/* 確認用ページだけの見た目(アプリの css は読まない)。?theme=dark で暗く */
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:var(--w) 12px/1.4 'Noto Sans JP',sans-serif}
h2{font-size:13px;margin:16px 0 8px;font-weight:var(--w-m);color:var(--tx-2)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.c{background:var(--card);border-radius:var(--r-md);padding:10px 4px 8px;text-align:center;color:var(--tx)}
.c small{display:block;margin-top:6px;color:var(--tx-3);font-size:11px}
.c .row{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px}
.c svg{flex:none}
.s16{width:16px;height:16px}.s24{width:24px;height:24px}.s48{width:48px;height:48px}
.me{color:var(--me)}
</style>
</head>
<body>
<div id="app"></div>
<script>
if (location.search.includes('theme=dark')) document.documentElement.dataset.theme = 'dark';
</script>
<script src="../js/parts.js"></script>
<script>
const keys = Object.keys(IC);
document.getElementById('app').innerHTML =
  `<h2>全 ${keys.length} 個 ・ 16 / 24 / 48 px ・ 24px の青 = 選択中</h2><div class="g">` +
  keys.map(k => `<div class="c"><div class="row">${ic(k, 's16')}${ic(k, 's24')}${ic(k, 's48')}</div><div class="row">${ic(k, 's24 me')}</div><small>${k}</small></div>`).join('') + '</div>';
</script>
</body>
</html>
